<text x="32" y="68" font-size="21" font-weight="700" text-anchor="start" fill="#e6edf3">Fewer, faster kernels</text>
<text x="40" y="108" font-size="13" font-weight="700" text-anchor="start" fill="#e6edf3">1  Fuse Q, K, V projections</text>
