<title>Architecture of team.py: offline batch path and live query path</title>
<style>text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','Cascadia Mono',Consolas,Menlo,monospace}.mute{fill:#8b98a5}.dim{fill:#5d6b78}.ox{transform-box:fill-box;transform-origin:0% 50%}.oy{transform-box:fill-box;transform-origin:50% 100%}.oc{transform-box:fill-box;transform-origin:50% 50%}@keyframes lf{0%{opacity:0}2%,95%{opacity:1}100%{opacity:0}}.lf{animation:lf 10s linear infinite both}@keyframes k1{0%,2.00%{opacity:0;transform:translateY(10px);animation-timing-function:cubic-bezier(.16,1,.3,1)}10.00%,100%{opacity:1;transform:translateY(0)}}.k1{animation:k1 10s linear infinite both}@keyframes k2{0%,3.20%{opacity:0;transform:translateY(10px);animation-timing-function:cubic-bezier(.16,1,.3,1)}11.20%,100%{opacity:1;transform:translateY(0)}}.k2{animation:k2 10s linear infinite both}@keyframes k3{0%,4.40%{opacity:0;transform:translateY(10px);animation-timing-function:cubic-bezier(.16,1,.3,1)}12.40%,100%{opacity:1;transform:translateY(0)}}.k3{animation:k3 10s linear infinite both}@keyframes k4{0%,5.60%{opacity:0;transform:translateY(10px);animation-timing-function:cubic-bezier(.16,1,.3,1)}13.60%,100%{opacity:1;transform:translateY(0)}}.k4{animation:k4 10s linear infinite both}@keyframes k5{0%,6.80%{opacity:0;transform:translateY(10px);animation-timing-function:cubic-bezier(.16,1,.3,1)}14.80%,100%{opacity:1;transform:translateY(0)}}.k5{animation:k5 10s linear infinite both}@keyframes k6{0%,9.00%{opacity:0;transform:translateY(10px);animation-timing-function:cubic-bezier(.16,1,.3,1)}17.00%,100%{opacity:1;transform:translateY(0)}}.k6{animation:k6 10s linear infinite both}@keyframes k7{0%,10.20%{opacity:0;transform:translateY(10px);animation-timing-function:cubic-bezier(.16,1,.3,1)}18.20%,100%{opacity:1;transform:translateY(0)}}.k7{animation:k7 10s linear infinite both}@keyframes k8{0%,11.40%{opacity:0;transform:translateY(10px);animation-timing-function:cubic-bezier(.16,1,.3,1)}19.40%,100%{opacity:1;transform:translateY(0)}}.k8{animation:k8 10s linear infinite both}@keyframes k9{0%,12.60%{opacity:0;transform:translateY(10px);animation-timing-function:cubic-bezier(.16,1,.3,1)}20.60%,100%{opacity:1;transform:translateY(0)}}.k9{animation:k9 10s linear infinite both}@keyframes k10{0%,13.80%{opacity:0;transform:translateY(10px);animation-timing-function:cubic-bezier(.16,1,.3,1)}21.80%,100%{opacity:1;transform:translateY(0)}}.k10{animation:k10 10s linear infinite both}@keyframes k11{0%,16.00%{opacity:0;transform:translateY(10px);animation-timing-function:cubic-bezier(.16,1,.3,1)}24.00%,100%{opacity:1;transform:translateY(0)}}.k11{animation:k11 10s linear infinite both}@keyframes k12{0%,17.20%{opacity:0;transform:translateY(10px);animation-timing-function:cubic-bezier(.16,1,.3,1)}25.20%,100%{opacity:1;transform:translateY(0)}}.k12{animation:k12 10s linear infinite both}@keyframes k13{0%,18.40%{opacity:0;transform:translateY(10px);animation-timing-function:cubic-bezier(.16,1,.3,1)}26.40%,100%{opacity:1;transform:translateY(0)}}.k13{animation:k13 10s linear infinite both}@keyframes k14{0%,19.60%{opacity:0;transform:translateY(10px);animation-timing-function:cubic-bezier(.16,1,.3,1)}27.60%,100%{opacity:1;transform:translateY(0)}}.k14{animation:k14 10s linear infinite both}@keyframes k15{0%,20.80%{opacity:0;transform:translateY(10px);animation-timing-function:cubic-bezier(.16,1,.3,1)}28.80%,100%{opacity:1;transform:translateY(0)}}.k15{animation:k15 10s linear infinite both}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style>
<defs><linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16324f" stop-opacity=".55"/><stop offset=".55" stop-color="#0b1016" stop-opacity="0"/></linearGradient><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#2c3946"/><line x1="0" y1="0" x2="0" y2="6" stroke="#3a4958" stroke-width="2"/></pattern></defs>
<rect width="960" height="470" rx="16" fill="#0b1016"/><rect width="960" height="470" rx="16" fill="url(#glow)"/><rect x=".5" y=".5" width="959" height="469" rx="15.5" fill="none" stroke="#223040"/>
<g class="lf">
<text x="32" y="40" font-size="11" font-weight="600" text-anchor="start" fill="#e6edf3" class="mono mute" letter-spacing="1.5">THE PROPOSED SOLUTION · team.py</text>
<text x="32" y="68" font-size="21" font-weight="700" text-anchor="start" fill="#e6edf3">Same model, re-engineered execution</text>
<text x="32" y="90" font-size="13" font-weight="400" text-anchor="start" fill="#e6edf3" class="mute">setup() (untimed) loads FP16 + FP32 weight copies, warms up at real shapes and captures CUDA Graphs.</text>
<text x="32" y="124" font-size="10" font-weight="700" text-anchor="start" fill="#8b98a5" class="mono" letter-spacing="1.5">CPU · PRODUCER THREAD</text>
<text x="32" y="250" font-size="10" font-weight="700" text-anchor="start" fill="#3b8ff0" class="mono" letter-spacing="1.5">GPU · CONSUMER</text>
<text x="32" y="376" font-size="10" font-weight="700" text-anchor="start" fill="#f07a3c" class="mono" letter-spacing="1.5">LIVE PATH · encode([query])</text>
<g class="k1"><rect x="32" y="134" width="166" height="54" rx="9" fill="#111922" stroke="#8b98a5" stroke-opacity=".75"/><text x="115.0" y="158" font-size="12.5" font-weight="700" text-anchor="middle" fill="#e6edf3">encode(texts)</text><text x="115.0" y="176" font-size="10.5" font-weight="400" text-anchor="middle" fill="#e6edf3" class="mute">N passages, any order</text></g>
<g class="k2"><rect x="216" y="134" width="166" height="54" rx="9" fill="#111922" stroke="#8b98a5" stroke-opacity=".75"/><text x="299.0" y="158" font-size="12.5" font-weight="700" text-anchor="middle" fill="#e6edf3">Rust tokenizer</text><text x="299.0" y="176" font-size="10.5" font-weight="400" text-anchor="middle" fill="#e6edf3" class="mute">16k-text chunks, no pad</text></g>
<g class="k3"><rect x="400" y="134" width="166" height="54" rx="9" fill="#111922" stroke="#8b98a5" stroke-opacity=".75"/><text x="483.0" y="158" font-size="12.5" font-weight="700" text-anchor="middle" fill="#e6edf3">Sort by length</text><text x="483.0" y="176" font-size="10.5" font-weight="400" text-anchor="middle" fill="#e6edf3" class="mute">short → long</text></g>
<g class="k4"><rect x="584" y="134" width="166" height="54" rx="9" fill="#111922" stroke="#8b98a5" stroke-opacity=".75"/><text x="667.0" y="158" font-size="12.5" font-weight="700" text-anchor="middle" fill="#e6edf3">Token-budget batches</text><text x="667.0" y="176" font-size="10.5" font-weight="400" text-anchor="middle" fill="#e6edf3" class="mute">8,192 tok · split at ×8</text></g>
<g class="k5"><rect x="768" y="134" width="166" height="54" rx="9" fill="#111922" stroke="#8b98a5" stroke-opacity=".75"/><text x="851.0" y="158" font-size="12.5" font-weight="700" text-anchor="middle" fill="#e6edf3">Pinned memory</text><text x="851.0" y="176" font-size="10.5" font-weight="400" text-anchor="middle" fill="#e6edf3" class="mute">ready for async copy</text></g>
<g class="k6"><rect x="32" y="260" width="166" height="54" rx="9" fill="#111922" stroke="#3b8ff0" stroke-opacity=".75"/><text x="115.0" y="284" font-size="12.5" font-weight="700" text-anchor="middle" fill="#e6edf3">Async H2D copy</text><text x="115.0" y="302" font-size="10.5" font-weight="400" text-anchor="middle" fill="#e6edf3" class="mute">non-blocking</text></g>
<g class="k7"><rect x="216" y="260" width="166" height="54" rx="9" fill="#111922" stroke="#3b8ff0" stroke-opacity=".75"/><text x="299.0" y="284" font-size="12.5" font-weight="700" text-anchor="middle" fill="#e6edf3">12-layer encoder</text><text x="299.0" y="302" font-size="10.5" font-weight="400" text-anchor="middle" fill="#e6edf3" class="mute">FP16 &gt;32 tok · FP32 ≤32</text></g>
<g class="k8"><rect x="400" y="260" width="166" height="54" rx="9" fill="#111922" stroke="#3b8ff0" stroke-opacity=".75"/><text x="483.0" y="284" font-size="12.5" font-weight="700" text-anchor="middle" fill="#e6edf3">CLS-only last layer</text><text x="483.0" y="302" font-size="10.5" font-weight="400" text-anchor="middle" fill="#e6edf3" class="mute">K,V all · rest CLS</text></g>
<g class="k9"><rect x="584" y="260" width="166" height="54" rx="9" fill="#111922" stroke="#3b8ff0" stroke-opacity=".75"/><text x="667.0" y="284" font-size="12.5" font-weight="700" text-anchor="middle" fill="#e6edf3">L2-norm + scatter</text><text x="667.0" y="302" font-size="10.5" font-weight="400" text-anchor="middle" fill="#e6edf3" class="mute">back to input order</text></g>
<g class="k10"><rect x="768" y="260" width="166" height="54" rx="9" fill="#111922" stroke="#3b8ff0" stroke-opacity=".75"/><text x="851.0" y="284" font-size="12.5" font-weight="700" text-anchor="middle" fill="#e6edf3">1 × D2H copy</text><text x="851.0" y="302" font-size="10.5" font-weight="400" text-anchor="middle" fill="#e6edf3" class="mute">→ [N, 768] float32</text></g>
<g class="k11"><rect x="32" y="386" width="166" height="54" rx="9" fill="#111922" stroke="#f07a3c" stroke-opacity=".75"/><text x="115.0" y="410" font-size="12.5" font-weight="700" text-anchor="middle" fill="#e6edf3">1 query</text><text x="115.0" y="428" font-size="10.5" font-weight="400" text-anchor="middle" fill="#e6edf3" class="mute">≈12 tokens</text></g>
<g class="k12"><rect x="216" y="386" width="166" height="54" rx="9" fill="#111922" stroke="#f07a3c" stroke-opacity=".75"/><text x="299.0" y="410" font-size="12.5" font-weight="700" text-anchor="middle" fill="#e6edf3">Tokenise</text><text x="299.0" y="428" font-size="10.5" font-weight="400" text-anchor="middle" fill="#e6edf3" class="mute">~0.1 ms</text></g>
<g class="k13"><rect x="400" y="386" width="166" height="54" rx="9" fill="#111922" stroke="#f07a3c" stroke-opacity=".75"/><text x="483.0" y="410" font-size="12.5" font-weight="700" text-anchor="middle" fill="#e6edf3">Pick bucket</text><text x="483.0" y="428" font-size="10.5" font-weight="400" text-anchor="middle" fill="#e6edf3" class="mute">32 · 64 · 128</text></g>
<g class="k14"><rect x="584" y="386" width="166" height="54" rx="9" fill="#111922" stroke="#f07a3c" stroke-opacity=".75"/><text x="667.0" y="410" font-size="12.5" font-weight="700" text-anchor="middle" fill="#e6edf3">CUDA Graph replay</text><text x="667.0" y="428" font-size="10.5" font-weight="400" text-anchor="middle" fill="#e6edf3" class="mute">32-graph runs FP32</text></g>
<g class="k15"><rect x="768" y="386" width="166" height="54" rx="9" fill="#111922" stroke="#f07a3c" stroke-opacity=".75"/><text x="851.0" y="410" font-size="12.5" font-weight="700" text-anchor="middle" fill="#e6edf3">[1, 768]</text><text x="851.0" y="428" font-size="10.5" font-weight="400" text-anchor="middle" fill="#e6edf3" class="mute">p50 4.4 ms</text></g>
